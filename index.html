<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f2eee6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eco" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Eco</title>
    <style>
      /* Pantalla de arranque: se ve al instante mientras carga la app */
      html, body { margin: 0; background: #f2eee6; }
      @media (prefers-color-scheme: dark) { html, body { background: #12110f; } }
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .boot img { width: 72px; height: 72px; border-radius: 18px; animation: boot 1.2s ease-in-out infinite alternate; }
      @keyframes boot { from { opacity: .55; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/icon.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
