<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f2eee6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eco" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Eco</title>
    <script>
      // El tema que eligió el usuario se aplica antes de pintar nada: así no hay destello claro → oscuro
      try {
        var t = localStorage.getItem('eco:theme');
        var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', d ? '#12110f' : '#f2eee6');
        // App instalada: Android acaba de enseñar su splash con background_color del manifest (#1b1a17).
        // Arrancamos en ese mismo color y fundimos al del tema, en vez de cambiar de golpe.
        if (matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('splash');
      } catch (e) {}
    </script>
    <style>
      /* Pantalla de arranque: mismo fondo que la app. El logo solo aparece si la carga tarda;
         cuando la app está lista, esta capa se desvanece encima de ella (sin corte brusco). */
      html, body { margin: 0; background: #f2eee6; }
      html.dark, html.dark body { background: #12110f; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #f2eee6; transition: opacity .28s ease-out, background-color .45s ease; }
      html.dark #boot { background: #12110f; }
      html.splash #boot { background: #1b1a17; transition: none; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot img { width: 72px; height: 72px; border-radius: 18px; opacity: 0; animation: boot-in .3s ease-out .4s forwards; }
      @keyframes boot-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <div id="boot"><img src="/icon.svg" alt="" /></div>
    <script>
      // Tras el primer frame (ya en el color del splash) empieza el fundido al color del tema
      requestAnimationFrame(function () { requestAnimationFrame(function () { document.documentElement.classList.remove('splash'); }); });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
